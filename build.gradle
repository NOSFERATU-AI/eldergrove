plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

import java.awt.image.BufferedImage
import javax.imageio.ImageIO
import java.util.Base64

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def generatedTexturesDir = layout.buildDirectory.dir('generated/eldergroveTextures')

sourceSets.main.resources {
    srcDir('src/generated/resources')
    srcDir(generatedTexturesDir)
    exclude("src/generated/**/.cache")
}

repositories {
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
}

tasks.register('generateEldergroveTextures') {
    outputs.dir(generatedTexturesDir)

    doLast {
        File root = generatedTexturesDir.get().asFile

        def clamp = { int value -> Math.max(0, Math.min(255, value)) }
        def argb = { int a, int r, int g, int b ->
            (int) ((clamp(a) << 24) | (clamp(r) << 16) | (clamp(g) << 8) | clamp(b))
        }
        def noise = { int x, int y, int salt ->
            (((x * 37 + y * 57 + salt * 101 + x * y * 13) & 15) - 7)
        }
        def writeTexture = { String name, Closure<Integer> colorAt ->
            File file = new File(root, "assets/eldergrove/textures/block/${name}.png")
            file.parentFile.mkdirs()
            BufferedImage image = new BufferedImage(16, 16, BufferedImage.TYPE_INT_ARGB)
            for (int y = 0; y < 16; y++) {
                for (int x = 0; x < 16; x++) {
                    image.setRGB(x, y, colorAt(x, y))
                }
            }
            ImageIO.write(image, 'png', file)
        }
        def writePngAsset = { String name, String encoded ->
            File file = new File(root, "assets/eldergrove/textures/block/${name}.png")
            file.parentFile.mkdirs()
            file.bytes = Base64.getDecoder().decode(encoded)
        }

        def grassTop = { String name, int salt, int r, int g, int b, int auraR, int auraG, int auraB ->
            writeTexture(name) { int x, int y ->
                int n = noise(x, y, salt)
                boolean aura = ((x * 3 + y * 5 + salt) % 29 == 0)
                boolean softPatch = ((x + y * 2 + salt) % 7 == 0)
                argb(255, r + n + (aura ? auraR : 0), g + n * 2 + (softPatch ? 8 : 0) + (aura ? auraG : 0), b + n + (aura ? auraB : 0))
            }
        }

        def grassSide = { String name, int salt, int r, int g, int b ->
            writeTexture(name) { int x, int y ->
                int n = noise(x, y, salt)
                if (y < 5) {
                    boolean aura = ((x * 5 + y * 7 + salt) % 31 == 0)
                    argb(255, r + n + (aura ? 14 : 0), g + n * 2, b + n + (aura ? 18 : 0))
                } else {
                    argb(255, 78 + n, 59 + n, 40 + n)
                }
            }
        }

        grassTop('eldergrove_grass_faint_top', 11, 49, 106, 62, 10, 10, 14)
        grassSide('eldergrove_grass_faint_side', 12, 44, 92, 56)

        grassTop('eldergrove_grass_top', 13, 37, 96, 76, 18, 16, 26)
        grassSide('eldergrove_grass_side', 14, 34, 82, 66)

        grassTop('eldergrove_grass_deep_top', 15, 25, 79, 87, 22, 24, 36)
        grassSide('eldergrove_grass_deep_side', 16, 26, 70, 76)

        writeTexture('eldergrove_moss') { int x, int y ->
            int n = noise(x, y, 1)
            boolean deep = ((x * 2 + y * 3) % 11 == 0)
            boolean glow = ((x * 5 + y * 7) % 37 == 0)
            argb(255, 22 + n + (glow ? 18 : 0), 64 + n * 2 + (glow ? 26 : 0), 43 + n + (deep ? 18 : 0) + (glow ? 36 : 0))
        }

        [
                elderwood_log      : '',
                elderwood_log_top  : '',
                elderwood_leaves   : '',
                elderwood_sapling  : '',
                elderwood_planks   : '',
                greatwood_log      : '',
                greatwood_log_top  : '',
                greatwood_leaves   : '',
                greatwood_planks   : '',
                greatwood_sapling  : '',
                grove_heart        : '',
                grove_heart_top    : ''
        ].each { name, encoded -> writePngAsset(name as String, encoded as String) }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources').configure {
    dependsOn(tasks.named('generateEldergroveTextures'))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
