plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

import java.awt.image.BufferedImage
import javax.imageio.ImageIO

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def generatedTexturesDir = layout.buildDirectory.dir('generated/eldergroveTextures')

sourceSets.main.resources {
    srcDir('src/generated/resources')
    srcDir(generatedTexturesDir)
    exclude("src/generated/**/.cache")
}

repositories {
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
}

tasks.register('generateEldergroveTextures') {
    outputs.dir(generatedTexturesDir)

    doLast {
        File root = generatedTexturesDir.get().asFile

        def clamp = { int value -> Math.max(0, Math.min(255, value)) }
        def argb = { int a, int r, int g, int b ->
            (int) ((clamp(a) << 24) | (clamp(r) << 16) | (clamp(g) << 8) | clamp(b))
        }
        def noise = { int x, int y, int salt ->
            (((x * 37 + y * 57 + salt * 101 + x * y * 13) & 15) - 7)
        }
        def writeTexture = { String name, Closure<Integer> colorAt ->
            File file = new File(root, "assets/eldergrove/textures/block/${name}.png")
            file.parentFile.mkdirs()
            BufferedImage image = new BufferedImage(16, 16, BufferedImage.TYPE_INT_ARGB)
            for (int y = 0; y < 16; y++) {
                for (int x = 0; x < 16; x++) {
                    image.setRGB(x, y, colorAt(x, y))
                }
            }
            ImageIO.write(image, 'png', file)
        }

        writeTexture('eldergrove_moss') { int x, int y ->
            int n = noise(x, y, 1)
            boolean deep = ((x * 2 + y * 3) % 11 == 0)
            boolean glow = ((x * 5 + y * 7) % 37 == 0)
            argb(255, 22 + n + (glow ? 18 : 0), 64 + n * 2 + (glow ? 26 : 0), 43 + n + (deep ? 18 : 0) + (glow ? 36 : 0))
        }

        writeTexture('elderwood_planks') { int x, int y ->
            int n = noise(x, y, 2)
            boolean seam = y == 3 || y == 7 || y == 11 || x == 0 || x == 15
            boolean grain = (x + y + n) % 5 == 0
            argb(255, 34 + n + (grain ? 8 : 0), 76 + n - (seam ? 12 : 0), 71 + n * 2 - (seam ? 14 : 0))
        }

        writeTexture('elderwood_log') { int x, int y ->
            int n = noise(x, y, 4)
            boolean paleStreak = x == 2 || x == 7 || x == 12 || ((x + y) % 13 == 0)
            boolean darkCrack = ((x * 3 + y) % 17 == 0)
            argb(255, 154 + n + (paleStreak ? 33 : 0) - (darkCrack ? 26 : 0), 180 + n + (paleStreak ? 20 : 0) - (darkCrack ? 18 : 0), 175 + n * 2 + (paleStreak ? 26 : 0) - (darkCrack ? 12 : 0))
        }

        writeTexture('elderwood_log_top') { int x, int y ->
            double dx = x - 7.5D
            double dy = y - 7.5D
            int ring = ((int) Math.floor(Math.sqrt(dx * dx + dy * dy) * 2.2D)) % 4
            int n = noise(x, y, 5)
            boolean glowRing = ring == 0 && ((x + y) % 3 == 0)
            argb(255, 172 + n - ring * 7 + (glowRing ? 20 : 0), 193 + n - ring * 5 + (glowRing ? 12 : 0), 190 + n - ring * 2 + (glowRing ? 18 : 0))
        }

        writeTexture('elderwood_leaves') { int x, int y ->
            int n = noise(x, y, 6)
            boolean pale = ((x * 2 + y * 5) % 19 == 0)
            boolean blueGlow = ((x * 7 + y * 11) % 43 == 0)
            argb(255, 70 + n + (pale ? 30 : 0), 128 + n + (pale ? 32 : 0) + (blueGlow ? 18 : 0), 105 + n * 2 + (pale ? 40 : 0) + (blueGlow ? 44 : 0))
        }

        writeTexture('grove_heart') { int x, int y ->
            double dx = x - 7.5D
            double dy = y - 7.5D
            double dist = Math.sqrt(dx * dx + dy * dy)
            int n = noise(x, y, 7)
            boolean cross = x == 7 || x == 8 || y == 7 || y == 8
            boolean rune = cross || (((x + y) % 6 == 0 || (x * 2 - y) % 7 == 0) && dist < 6.5D)
            int glow = Math.max(0, 95 - (int) (dist * 11))
            argb(255, 26 + n + (rune ? 55 : 0), 86 + n + glow + (rune ? 52 : 0), 92 + n + glow + (rune ? 78 : 0))
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources').configure {
    dependsOn(tasks.named('generateEldergroveTextures'))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
