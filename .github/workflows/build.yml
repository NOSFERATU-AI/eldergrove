name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --no-daemon

      - name: Patch runtime texture assets
        run: |
          python3 - <<'PY'
          import base64
          import zipfile
          from pathlib import Path

          textures = {
              'assets/eldergrove/textures/block/greatwood_leaves.png': '',
              'assets/eldergrove/textures/block/shimmerleaf.png': '',
              'assets/eldergrove/textures/block/vishroom.png': '',
          }

          jars = sorted(Path('build/libs').glob('*.jar'))
          if not jars:
              raise SystemExit('No jar found in build/libs')
          jar = jars[0]
          tmp = jar.with_suffix('.patched.jar')

          replace = set(textures)
          with zipfile.ZipFile(jar, 'r') as zin, zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED) as zout:
              for info in zin.infolist():
                  if info.filename in replace:
                      continue
                  zout.writestr(info, zin.read(info.filename))
              for name, encoded in textures.items():
                  zout.writestr(name, base64.b64decode(encoded))
          tmp.replace(jar)
          PY

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: eldergrove-jar
          path: build/libs/*.jar
