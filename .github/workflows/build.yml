name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force exact TC4 greatwood textures
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('build.gradle')
          text = path.read_text()
          replacements = {
              'greatwood_log': '',
              'greatwood_log_top': '',
              'greatwood_leaves': '',
              'greatwood_planks': '',
              'greatwood_sapling': ''
          }
          for key, value in replacements.items():
              text = re.sub(rf"{key}\s*: '[^']*'", f"{key:<19}: '{value}'", text)
          path.write_text(text)
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: eldergrove-jar
          path: build/libs/*.jar
