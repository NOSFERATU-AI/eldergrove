name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --no-daemon

      - name: Patch runtime texture assets
        run: |
          python3 - <<'PY'
          import base64
          import struct
          import zipfile
          from pathlib import Path

          # TC4 greatwood leaves are a grayscale leaf mask in modern rendering, so this jar patch
          # bakes in the old dark green look instead of shipping a gray texture.
          textures = {
              'assets/eldergrove/textures/block/greatwood_leaves.png': '',
              'assets/eldergrove/textures/block/shimmerleaf.png': '',
              'assets/eldergrove/textures/block/vishroom.png': '',
          }

          jars = sorted(Path('build/libs').glob('*.jar'))
          if not jars:
              raise SystemExit('No jar found in build/libs')
          jar = jars[0]
          tmp = jar.with_suffix('.patched.jar')

          decoded_textures = {}
          for name, encoded in textures.items():
              data = base64.b64decode(encoded)
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{name} is not a PNG')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != (16, 16):
                  raise SystemExit(f'{name} has wrong size: {width}x{height}')
              decoded_textures[name] = data

          replace = set(decoded_textures)
          with zipfile.ZipFile(jar, 'r') as zin, zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED) as zout:
              for info in zin.infolist():
                  if info.filename in replace:
                      continue
                  zout.writestr(info, zin.read(info.filename))
              for name, data in decoded_textures.items():
                  zout.writestr(name, data)
          tmp.replace(jar)
          PY

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: eldergrove-jar
          path: build/libs/*.jar