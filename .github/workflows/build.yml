name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Thaumcraft-style textures
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          out = Path('src/main/resources/assets/eldergrove/textures/block')
          out.mkdir(parents=True, exist_ok=True)

          textures = {
              'shimmerleaf.png': '',
              'vishroom.png': '',
              'greatwood_log.png': '',
              'greatwood_log_top.png': '',
              'greatwood_leaves.png': ''
          }

          for name, data in textures.items():
              (out / name).write_bytes(base64.b64decode(data))
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: eldergrove-jar
          path: build/libs/*.jar
